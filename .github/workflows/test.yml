name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: go test -count=1 -v ./...
      - name: Test with race detector on Unix
        if: runner.os != 'Windows'
        run: go test -race -count=1 -v ./...
      - uses: actions/setup-node@v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: CLI smoke tests
        if: runner.os == 'Linux'
        run: |
          go build -o bin/debounce .
          npm install --global bats@1.12.0
          bats --verbose-run test
