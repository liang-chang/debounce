---
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: debounce
dist: dist/release

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    # - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - THIRD-PARTY-NOTICES
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  -
    id: 'debounce'
    package_name: debounce
    ids:
      - 'debounce'
    vendor: 'liang-chang'
    homepage: 'https://github.com/liang-chang/debounce'
    maintainer: 'liang-chang'
    description: 'Cross-process trailing-edge debounce for commands'
    license: 'Apache-2.0 OR MIT'
    provides:
      - debounce
    formats:
      - 'deb'
      - 'rpm'
    bindir: '/usr/bin'
    contents:
      - src: 'CHANGELOG.md'
        dst: '/usr/share/doc/debounce/CHANGELOG.md'
      - src: 'LICENSE-APACHE'
        dst: '/usr/share/doc/debounce/LICENSE-APACHE'
      - src: 'LICENSE-MIT'
        dst: '/usr/share/doc/debounce/LICENSE-MIT'
      - src: 'README.md'
        dst: '/usr/share/doc/debounce/README.md'
      - src: 'THIRD-PARTY-NOTICES'
        dst: '/usr/share/doc/debounce/THIRD-PARTY-NOTICES'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
